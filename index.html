<!doctype html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='default'>
<meta name='apple-mobile-web-app-title' content='減量プロジェクト'>
<title>減量プロジェクト</title>

<style>
:root{
  --bg:#f2f2f7;--card:#ffffff;--accent:#0a84ff;--accent-soft:#e8f3ff;--good:#30d158;
  --text:#111111;--sub:#6e6e73;--line:#e5e5ea;--radius-lg:24px;--radius-md:16px;--radius-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text)}

#app{max-width:430px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(env(safe-area-inset-bottom) + 84px)}

.topbar{padding:max(env(safe-area-inset-top),20px) 60px 8px 20px}
.topbar h1{font-size:28px;margin:0;letter-spacing:-.02em}
.topbar .ver{font-size:11px;color:var(--sub);font-weight:600;margin-top:3px}

.screen{display:none;padding:8px 16px 16px;animation:fadeIn .25s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--card);border-radius:var(--radius-lg);padding:20px;margin:12px 0;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.card h2{margin:0 0 14px;font-size:17px}
.card .sub{color:var(--sub);font-size:13px;margin-top:-8px;margin-bottom:14px}

.progress-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.progress-head .now{font-size:36px;font-weight:800;letter-spacing:-.02em}
.progress-head .unit{font-size:16px;color:var(--sub);font-weight:600;margin-left:2px}
.progress-head .goal{font-size:13px;color:var(--sub);text-align:right}
.progress-head .goal b{color:var(--text);font-size:15px}
.now-date{font-size:12px;color:var(--sub);margin-top:2px}
.forecast{color:var(--sub);font-weight:500}

.bar-track{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .4s ease}
.bar-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:6px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#f7f7fa;padding:14px;border-radius:var(--radius-md)}
.stat .lbl{font-size:12px;color:var(--sub);margin-bottom:4px}
.stat .big{font-size:22px;font-weight:700}

label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
.field{display:flex;align-items:center;gap:12px;height:60px;border:1px solid var(--line);border-radius:var(--radius-md);padding:0 16px}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:26px;font-weight:700;font-family:inherit;color:var(--text)}
.field .unit{flex:0 0 50px;text-align:right;color:var(--sub);font-weight:600;font-size:14px}

.btn-primary{width:100%;height:54px;border:0;border-radius:var(--radius-md);background:var(--accent);color:#fff;font-size:17px;font-weight:700;margin-top:16px}
.btn-primary:active{opacity:.85}

.list{margin-top:4px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row .d{color:var(--sub)}

.placeholder{text-align:center;padding:60px 20px;color:var(--sub)}
.placeholder .icon{width:44px;height:44px;margin:0 auto 14px;color:var(--sub);opacity:.55}
.placeholder .icon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.placeholder .title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
.placeholder .desc{font-size:13px;line-height:1.6}

.week-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none;-ms-overflow-style:none}
.week-tabs::-webkit-scrollbar{display:none}
.week-pill{flex:0 0 auto;padding:9px 16px;border-radius:999px;background:#eef0f3;color:var(--sub);font-size:13px;font-weight:700;border:0;font-family:inherit;white-space:nowrap}
.week-pill.active{background:var(--accent);color:#fff}

.chart-wrap{width:100%;height:170px}
.chart-empty{text-align:center;padding:36px 0;color:var(--sub);font-size:13px}

.report-lead{font-size:14.5px;line-height:1.7;color:var(--text);margin:0}
.report-text{font-size:13px;line-height:1.7;color:var(--sub);margin:0}

.btnrow{display:flex;gap:10px;margin-top:14px}
.btn2{flex:1;height:46px;border:0;border-radius:14px;background:#eef2f7;color:var(--accent);font-size:15px;font-weight:600;font-family:inherit}
.btn2:active{opacity:.8}
.btn-danger{width:100%;height:50px;border:0;border-radius:var(--radius-md);background:#ff3b30;color:#fff;font-size:15px;font-weight:700;margin-top:14px;font-family:inherit}
.btn-danger:active{opacity:.85}
#settingsFileInput{display:none}

.fab-wrap{position:fixed;top:0;left:0;right:0;max-width:430px;margin:0 auto;pointer-events:none;z-index:15}
.fab-add{position:absolute;top:max(env(safe-area-inset-top),20px);right:16px;width:34px;height:34px;border-radius:50%;background:var(--accent);border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(10,132,255,.35);pointer-events:auto}
.fab-add svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}

.todo-list{display:flex;flex-direction:column}
.todo-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 2px;border:0;background:none;font-family:inherit;font-size:12.5px;color:var(--text);text-align:left}
.todo-check{width:19px;height:19px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.todo-item.done .todo-check{background:var(--good);border-color:var(--good)}
.todo-check svg{display:none;width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.todo-item.done .todo-check svg{display:block}
.todo-item.done .todo-label{color:var(--sub)}

#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:20;font-size:14px}
#toast.err{background:#ff3b30}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);display:flex;max-width:430px;margin:0 auto;z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:6px 0;color:var(--sub);font-size:10px;font-weight:600;font-family:inherit}
.tab .ic{width:24px;height:24px;display:block}
.tab .ic svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--accent)}
.tab.active .ic svg{stroke-width:2.1}
</style>
</head>

<body>
<div id='toast'></div>
<div class='fab-wrap'>
  <button id='fabAdd' class='fab-add' onclick='goToRecordDate()' aria-label='記録を追加'>
    <svg viewBox='0 0 24 24'><path d='M12 5v14M5 12h14'/></svg>
  </button>
</div>

<div id='app'>

  <div class='topbar'>
    <h1 id='screenTitle'>ホーム</h1>
    <div class='ver'>Ver.1.0.0</div>
  </div>

  <section class='screen active' id='screen-home'>
    <div class='card'>
      <div class='progress-head'>
        <div><span class='now' id='homeNow'>-</span><span class='unit'>kg</span><div class='now-date' id='homeDateLbl'>記録なし</div></div>
        <div class='goal'>目標<br><b id='homeGoal'>-</b></div>
      </div>
      <div class='bar-track'><div class='bar-fill' id='homeBar' style='width:0%'></div></div>
      <div class='bar-labels'><span id='homeStartLbl'>開始</span><span id='homeRemainLbl'>残り -</span></div>
    </div>

    <div class='card'>
      <h2>今週のサマリー</h2>
      <div class='stats'>
        <div class='stat'><div class='lbl'>直近7日平均体重</div><div class='big' id='homeAvg7'>-</div></div>
        <div class='stat'><div class='lbl'>今週の総運動</div><div class='big' id='homeWeekKcal'>-</div></div>
        <div class='stat'><div class='lbl'>記録日数</div><div class='big' id='homeCount'>-</div></div>
        <div class='stat'><div class='lbl'>最終更新</div><div class='big' id='homeLastDate' style='font-size:16px'>-</div></div>
      </div>
    </div>

    <div class='card'>
      <h2 style='font-size:15px'>今日やること</h2>
      <div class='todo-list' id='todoList'></div>
    </div>
  </section>

  <section class='screen' id='screen-record'>
    <div class='card'>
      <h2>今日の記録</h2>
      <label>日付</label>
      <div class='field'>
