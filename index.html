<!doctype html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='default'>
<meta name='apple-mobile-web-app-title' content='減量プロジェクト'>
<title>減量プロジェクト</title>

<!--
  ============================================================
  減量プロジェクト - index.html
  Ver.1.0.0
  ============================================================
-->

<style>
:root{
  --bg:#f2f2f7;--card:#ffffff;--accent:#0a84ff;--accent-soft:#e8f3ff;--good:#30d158;
  --text:#111111;--sub:#6e6e73;--line:#e5e5ea;--radius-lg:24px;--radius-md:16px;--radius-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text)}

#app{max-width:430px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(env(safe-area-inset-bottom) + 84px)}

.topbar{padding:max(env(safe-area-inset-top),20px) 60px 8px 20px}
.topbar h1{font-size:28px;margin:0;letter-spacing:-.02em}
.topbar .ver{font-size:11px;color:var(--sub);font-weight:600;margin-top:3px}

.screen{display:none;padding:8px 16px 16px;animation:fadeIn .25s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--card);border-radius:var(--radius-lg);padding:20px;margin:12px 0;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.card h2{margin:0 0 14px;font-size:17px}
.card .sub{color:var(--sub);font-size:13px;margin-top:-8px;margin-bottom:14px}

.progress-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.progress-head .now{font-size:36px;font-weight:800;letter-spacing:-.02em}
.progress-head .unit{font-size:16px;color:var(--sub);font-weight:600;margin-left:2px}
.progress-head .goal{font-size:13px;color:var(--sub);text-align:right}
.progress-head .goal b{color:var(--text);font-size:15px}
.now-date{font-size:12px;color:var(--sub);margin-top:2px}
.forecast{color:var(--sub);font-weight:500}

.bar-track{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .4s ease}
.bar-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:6px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#f7f7fa;padding:14px;border-radius:var(--radius-md)}
.stat .lbl{font-size:12px;color:var(--sub);margin-bottom:4px}
.stat .big{font-size:22px;font-weight:700}

label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
.field{display:flex;align-items:center;gap:12px;height:60px;border:1px solid var(--line);border-radius:var(--radius-md);padding:0 16px}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:26px;font-weight:700;font-family:inherit;color:var(--text)}
.field .unit{flex:0 0 50px;text-align:right;color:var(--sub);font-weight:600;font-size:14px}

.btn-primary{width:100%;height:54px;border:0;border-radius:var(--radius-md);background:var(--accent);color:#fff;font-size:17px;font-weight:700;margin-top:16px}
.btn-primary:active{opacity:.85}

.list{margin-top:4px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row .d{color:var(--sub)}

.placeholder{text-align:center;padding:60px 20px;color:var(--sub)}
.placeholder .icon{width:44px;height:44px;margin:0 auto 14px;color:var(--sub);opacity:.55}
.placeholder .icon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.placeholder .title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
.placeholder .desc{font-size:13px;line-height:1.6}

.week-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none;-ms-overflow-style:none}
.week-tabs::-webkit-scrollbar{display:none}
.week-pill{flex:0 0 auto;padding:9px 16px;border-radius:999px;background:#eef0f3;color:var(--sub);font-size:13px;font-weight:700;border:0;font-family:inherit;white-space:nowrap}
.week-pill.active{background:var(--accent);color:#fff}

.chart-wrap{width:100%;height:170px}
.chart-empty{text-align:center;padding:36px 0;color:var(--sub);font-size:13px}

.fab-wrap{position:fixed;top:0;left:0;right:0;max-width:430px;margin:0 auto;pointer-events:none;z-index:15}
.fab-add{position:absolute;top:max(env(safe-area-inset-top),20px);right:16px;width:34px;height:34px;border-radius:50%;background:var(--accent);border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(10,132,255,.35);pointer-events:auto}
.fab-add svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}

.todo-list{display:flex;flex-direction:column}
.todo-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 2px;border:0;background:none;font-family:inherit;font-size:12.5px;color:var(--text);text-align:left}
.todo-check{width:19px;height:19px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.todo-item.done .todo-check{background:var(--good);border-color:var(--good)}
.todo-check svg{display:none;width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.todo-item.done .todo-check svg{display:block}
.todo-item.done .todo-label{color:var(--sub)}

#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:20;font-size:14px}
#toast.err{background:#ff3b30}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);display:flex;max-width:430px;margin:0 auto;z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:6px 0;color:var(--sub);font-size:10px;font-weight:600;font-family:inherit}
.tab .ic{width:24px;height:24px;display:block}
.tab .ic svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--accent)}
.tab.active .ic svg{stroke-width:2.1}
</style>
</head>

<body>
<div id='toast'></div>
<div class='fab-wrap'>
  <button id='fabAdd' class='fab-add' onclick='goToRecordDate()' aria-label='記録を追加'>
    <svg viewBox='0 0 24 24'><path d='M12 5v14M5 12h14'/></svg>
  </button>
</div>

<div id='app'>

  <div class='topbar'>
    <h1 id='screenTitle'>ホーム</h1>
    <div class='ver'>Ver.1.0.0</div>
  </div>

  <section class='screen active' id='screen-home'>
    <div class='card'>
      <div class='progress-head'>
        <div><span class='now' id='homeNow'>-</span><span class='unit'>kg</span><div class='now-date' id='homeDateLbl'>記録なし</div></div>
        <div class='goal'>目標<br><b id='homeGoal'>-</b></div>
      </div>
      <div class='bar-track'><div class='bar-fill' id='homeBar' style='width:0%'></div></div>
      <div class='bar-labels'><span id='homeStartLbl'>開始</span><span id='homeRemainLbl'>残り -</span></div>
    </div>

    <div class='card'>
      <h2>今週のサマリー</h2>
      <div class='stats'>
        <div class='stat'><div class='lbl'>直近7日平均体重</div><div class='big' id='homeAvg7'>-</div></div>
        <div class='stat'><div class='lbl'>今週の総運動</div><div class='big' id='homeWeekKcal'>-</div></div>
        <div class='stat'><div class='lbl'>記録日数</div><div class='big' id='homeCount'>-</div></div>
        <div class='stat'><div class='lbl'>最終更新</div><div class='big' id='homeLastDate' style='font-size:16px'>-</div></div>
      </div>
    </div>

    <div class='card'>
      <h2 style='font-size:15px'>今日やること</h2>
      <div class='todo-list' id='todoList'></div>
    </div>
  </section>

  <section class='screen' id='screen-record'>
    <div class='card'>
      <h2>今日の記録</h2>
      <label>日付</label>
      <div class='field'><input id='r_date' type='date' onchange='loadEntryToForm()'></div>
      <label>体重</label>
      <div class='field'><input id='r_weight' inputmode='decimal' placeholder='0.0'><div class='unit'>kg</div></div>
      <label>サイクリング</label>
      <div class='field'><input id='r_cardio' inputmode='numeric' placeholder='0'><div class='unit'>kcal</div></div>
      <label>筋トレ</label>
      <div class='field'><input id='r_strength' inputmode='numeric' placeholder='0'><div class='unit'>kcal</div></div>
      <button class='btn-primary' onclick='saveEntry()'>保存</button>
    </div>

    <div class='card'>
      <h2>最近の記録</h2>
      <div class='list' id='recordList'></div>
    </div>
  </section>

  <section class='screen' id='screen-analysis'>
    <div class='week-tabs' id='weekTabs'></div>
    <div id='weekDetail'></div>
  </section>

  <section class='screen' id='screen-report'>
    <div class='card placeholder'>
      <div class='icon'><svg viewBox='0 0 24 24'><path d='M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z'/><path d='M14 3v4h4'/><path d='M9 13h6M9 16.5h6M9 9.5h2'/></svg></div>
      <div class='title'>レポート画面は準備中です</div>
      <div class='desc'>週次レポートのプレビュー・PDF書き出しを<br>次のアップデートで実装予定です。</div>
    </div>
  </section>

  <section class='screen' id='screen-settings'>
    <div class='card placeholder'>
      <div class='icon'><svg viewBox='0 0 24 24'><circle cx='12' cy='12' r='3'/><path d='M12 3 15.1 6.63 19.79 7.5 18.2 12 19.79 16.5 15.1 17.37 12 21 8.9 17.37 4.21 16.5 5.8 12 4.21 7.5 8.9 6.63Z'/></svg></div>
      <div class='title'>設定画面は準備中です</div>
      <div class='desc'>目標体重・開始体重・データのエクスポート/インポートを<br>次のアップデートで実装予定です。</div>
    </div>
  </section>

</div>

<nav class='tabbar'>
  <button class='tab active' data-screen='home' data-label='ホーム' onclick='switchScreen("home")'>
    <span class='ic'><svg viewBox='0 0 24 24'><path d='M3 11.5 12 4l9 7.5'/><path d='M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V19a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9'/></svg></span>ホーム
  </button>
  <button class='tab' data-screen='record' data-label='記録' onclick='switchScreen("record")'>
    <span class='ic'><svg viewBox='0 0 24 24'><path d='M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z'/><path d='M14 6.5 17.5 10'/></svg></span>記録
  </button>
  <button class='tab' data-screen='analysis' data-label='分析' onclick='switchScreen("analysis")'>
    <span class='ic'><svg viewBox='0 0 24 24'><path d='M4 20V4'/><path d='M4 20h16'/><rect x='7' y='13' width='2.6' height='7'/><rect x='12' y='9' width='2.6' height='11'/><rect x='17' y='5' width='2.6' height='15'/></svg></span>分析
  </button>
  <button class='tab' data-screen='report' data-label='レポート' onclick='switchScreen("report")'>
    <span class='ic'><svg viewBox='0 0 24 24'><path d='M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z'/><path d='M14 3v4h4'/><path d='M9 13h6M9 16.5h6M9 9.5h2'/></svg></span>レポート
  </button>
  <button class='tab' data-screen='settings' data-label='設定' onclick='switchScreen("settings")'>
    <span class='ic'><svg viewBox='0 0 24 24'><circle cx='12' cy='12' r='3'/><path d='M12 3 15.1 6.63 19.79 7.5 18.2 12 19.79 16.5 15.1 17.37 12 21 8.9 17.37 4.21 16.5 5.8 12 4.21 7.5 8.9 6.63Z'/></svg></span>設定
  </button>
</nav>

<script>
const CONFIG = {
  goalWeight: 75.0,
  startWeight: null
};
const STORE_KEY = 'trainingEntries';

const TITLES = {home:'ホーム',record:'記録',analysis:'分析',report:'レポート',settings:'設定'};

function switchScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.screen===name));
  screenTitle.textContent = TITLES[name];
  fabAdd.style.display = ['home','analysis','report'].includes(name) ? 'flex' : 'none';
  if(name==='home') refreshHome();
  if(name==='record') refreshRecord();
  if(name==='analysis') refreshAnalysis();
}

function goToRecordDate(){
  switchScreen('record');
  setTimeout(()=>{ r_date.focus(); }, 50);
}

function goToRecordField(key){
  switchScreen('record');
  const map = {weight:'r_weight', cardio:'r_cardio', strength:'r_strength'};
  setTimeout(()=>{ const el = document.getElementById(map[key]); if(el) el.focus(); }, 50);
}

function loadAll(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){
    console.error('load error', e);
    return {};
  }
}
function saveAll(obj){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(obj));
    return true;
  }catch(e){
    console.error('save error', e);
    return false;
  }
}
function sortedEntries(){
  return Object.values(loadAll()).sort((a,b)=> a.date < b.date ? 1 : -1);
}

function localDateStr(d){
  d = d || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function showToast(msg, isErr){
  toast.textContent = msg;
  toast.className = isErr ? 'err' : '';
  toast.style.opacity = 1;
  setTimeout(()=>{ toast.style.opacity = 0; }, 1500);
}

function refreshHome(){
  const entries = sortedEntries();
  const weighted = entries.filter(x => x.weight !== null && x.weight !== '');

  refreshTodo();

  if(!weighted.length){
    homeNow.textContent = '-';
    homeDateLbl.textContent = '記録なし';
    homeGoal.textContent = CONFIG.goalWeight.toFixed(1)+' kg';
    homeBar.style.width = '0%';
    homeStartLbl.textContent = '記録なし';
    homeRemainLbl.textContent = '-';
    homeAvg7.textContent = '-';
    homeWeekKcal.textContent = '-';
    homeCount.textContent = '0 日';
    homeLastDate.textContent = '-';
    return;
  }

  const latest = +weighted[0].weight;
  const start = CONFIG.startWeight || +weighted[weighted.length-1].weight;
  const goal = CONFIG.goalWeight;

  homeNow.textContent = latest.toFixed(1);
  const latestDateObj = new Date(weighted[0].date+'T00:00:00');
  homeDateLbl.textContent = (latestDateObj.getMonth()+1)+'月'+latestDateObj.getDate()+'日時点';
  homeGoal.textContent = goal.toFixed(1)+' kg';

  const totalDist = Math.max(start - goal, 0.01);
  const progressed = Math.min(Math.max(start - latest, 0), totalDist);
  const pct = Math.round((progressed/totalDist)*100);
  homeBar.style.width = pct+'%';
  homeStartLbl.textContent = '開始 '+start.toFixed(1)+'kg';

  const remain = Math.max(latest - goal, 0);
  const forecastText = estimateForecast(weighted, latest, goal);
  homeRemainLbl.innerHTML = remain>0
    ? `残り${remain.toFixed(1)}kg <span class='forecast'>・${forecastText}</span>`
    : '目標達成🎉';

  const last7 = weighted.slice(0,7).map(x=>+x.weight);
  homeAvg7.textContent = (last7.reduce((s,v)=>s+v,0)/last7.length).toFixed(1)+' kg';

  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
  const weekKcal = entries.filter(x => new Date(x.date) >= weekAgo)
    .reduce((s,x)=> s + (+x.cardio||0) + (+x.strength||0), 0);
  homeWeekKcal.textContent = weekKcal + ' kcal';

  homeCount.textContent = entries.length + ' 日';
  homeLastDate.textContent = entries[0].date;
}

function estimateForecast(weighted, latest, goal){
  if(latest <= goal) return '達成済み';
  const asc = [...weighted].reverse();
  const latestDate = asc[asc.length-1].date;
  let win = asc.filter(x => (new Date(latestDate) - new Date(x.date)) / 86400000 <= 21);
  if(win.length < 2) win = asc;
  if(win.length < 2) return '算出には記録が足りません';

  const f = win[0], l = win[win.length-1];
  const days = (new Date(l.date) - new Date(f.date)) / 86400000;
  if(days <= 0) return '算出には記録が足りません';
  const ratePerDay = (+l.weight - +f.weight) / days;

  if(ratePerDay >= -0.005) return 'ペース算出中';

  const daysNeeded = (latest - goal) / (-ratePerDay);
  const target = new Date(l.date);
  target.setDate(target.getDate() + Math.round(daysNeeded));
  return (target.getMonth()+1)+'/'+target.getDate()+'頃';
}

function refreshTodo(){
  const all = loadAll();
  const today = localDateStr();
  const e = all[today] || {};
  const filled = v => v !== undefined && v !== null && v !== '';
  const items = [
    { key:'weight',   label:'朝の体重測定入力',           done: filled(e.weight) },
    { key:'cardio',   label:'サイクリング消費カロリー入力', done: filled(e.cardio) },
    { key:'strength', label:'筋力トレ消費カロリー入力',     done: filled(e.strength) }
  ];
  todoList.innerHTML = items.map(it => `
    <button class='todo-item ${it.done?'done':''}' onclick='goToRecordField("${it.key}")'>
      <span class='todo-check'><svg viewBox='0 0 24 24'><path d='M5 13l4 4L19 7'/></svg></span>
      <span class='todo-label'>${it.label}</span>
    </button>
  `).join('');
}

function refreshRecord(){
  const entries = sortedEntries();
  recordList.innerHTML = entries.slice(0,10).map(x=>{
    const total = (+x.cardio||0) + (+x.strength||0);
    const w = (x.weight !== null && x.weight !== '') ? x.weight+'kg' : '-';
    return `<div class='row'><span class='d'>${x.date}</span><span>${w} / ${total}kcal</span></div>`;
  }).join('') || `<div class='row'><span class='d'>記録がまだありません</span></div>`;
}

function loadEntryToForm(){
  const all = loadAll();
  const e = all[r_date.value];
  r_weight.value = (e && e.weight !== null && e.weight !== undefined) ? e.weight : '';
  r_cardio.value = (e && e.cardio !== null && e.cardio !== undefined) ? e.cardio : '';
  r_strength.value = (e && e.strength !== null && e.strength !== undefined) ? e.strength : '';
}

function saveEntry(){
  if(!r_date.value){ showToast('日付を入力してください', true); return; }
  const all = loadAll();
  const existing = all[r_date.value] || {};
  all[r_date.value] = {
    date: r_date.value,
    weight: r_weight.value !== '' ? r_weight.value : (existing.weight ?? null),
    cardio: r_cardio.value !== '' ? r_cardio.value : (existing.cardio ?? null),
    strength: r_strength.value !== '' ? r_strength.value : (existing.strength ?? null)
  };
  const ok = saveAll(all);
  if(ok){
    showToast('保存しました', false);
    loadEntryToForm();
    refreshRecord();
    refreshTodo();
  }else{
    showToast('保存に失敗しました', true);
  }
}

let currentWeekKey = null;

function weekStart(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dow = (d.getDay()+6)%7;
  d.setDate(d.getDate()-dow);
  return localDateStr(d);
}

function weekLabel(wk){
  const s = new Date(wk+'T00:00:00');
  const e = new Date(s); e.setDate(e.getDate()+6);
  const f = d => (d.getMonth()+1)+'/'+d.getDate();
  return f(s)+' - '+f(e);
}

function refreshAnalysis(selectedWeek){
  const entries = sortedEntries();
  if(!entries.length){
    weekTabs.innerHTML = '';
    weekDetail.innerHTML = `<div class='card placeholder'>
      <div class='icon'><svg viewBox='0 0 24 24'><path d='M4 20V4'/><path d='M4 20h16'/><rect x='7' y='13' width='2.6' height='7'/><rect x='12' y='9' width='2.6' height='11'/><rect x='17' y='5' width='2.6' height='15'/></svg></div>
      <div class='title'>記録がまだありません</div>
      <div class='desc'>「記録」タブで体重や運動を記録すると<br>ここに週ごとの分析が自動で表示されます。</div>
    </div>`;
    return;
  }

  const groups = {};
  entries.forEach(e => {
    const wk = weekStart(e.date);
    (groups[wk] = groups[wk] || []).push(e);
  });
  const weekKeys = Object.keys(groups).sort((a,b) => a < b ? 1 : -1);

  currentWeekKey = (selectedWeek && groups[selectedWeek]) ? selectedWeek : weekKeys[0];

  weekTabs.innerHTML = weekKeys.map(wk =>
    `<button class='week-pill ${wk===currentWeekKey?'active':''}' onclick='refreshAnalysis("${wk}")'>${weekLabel(wk)}</button>`
  ).join('');

  renderWeekDetail(groups[currentWeekKey]);
}

function renderWeekDetail(weekEntries){
  const asc = [...weekEntries].sort((a,b) => a.date < b.date ? -1 : 1);
  const weighted = asc.filter(x => x.weight !== null && x.weight !== '');
  const totalKcal = weekEntries.reduce((s,x) => s + (+x.cardio||0) + (+x.strength||0), 0);
  const avgW = weighted.length ? weighted.reduce((s,x)=>s+ +x.weight,0)/weighted.length : null;
  const change = weighted.length >= 2 ? (+weighted[weighted.length-1].weight - +weighted[0].weight) : null;

  weekDetail.innerHTML = `
    <div class='card'>
      <h2>体重推移</h2>
      <div class='chart-wrap' id='chartWrap'></div>
    </div>
    <div class='card'>
      <div class='stats'>
        <div class='stat'><div class='lbl'>週の平均体重</div><div class='big'>${avgW!==null ? avgW.toFixed(1)+' kg' : '-'}</div></div>
        <div class='stat'><div class='lbl'>週内の増減</div><div class='big'>${change!==null ? (change>=0?'+':'')+change.toFixed(1)+' kg' : '-'}</div></div>
        <div class='stat'><div class='lbl'>合計運動</div><div class='big'>${totalKcal} kcal</div></div>
        <div class='stat'><div class='lbl'>記録日数</div><div class='big'>${weekEntries.length} 日</div></div>
      </div>
    </div>
    <div class='card'>
      <h2>日別記録</h2>
      <div class='list'>${[...asc].reverse().map(x=>{
        const total = (+x.cardio||0) + (+x.strength||0);
        const w = (x.weight !== null && x.weight !== '') ? x.weight+'kg' : '-';
        return `<div class='row'><span class='d'>${x.date}</span><span>${w} / ${total}kcal</span></div>`;
      }).join('')}</div>
    </div>
  `;
  drawWeightChart(weighted);
}

function drawWeightChart(weighted){
  const wrap = document.getElementById('chartWrap');
  if(!weighted.length){
    wrap.innerHTML = `<div class='chart-empty'>この週の体重記録がありません</div>`;
    return;
  }
  const W=300, H=170;
  const padL=34, padR=10, padT=18, padB=22;
  const values = weighted.map(x => +x.weight);
  const rawMin = Math.min(...values), rawMax = Math.max(...values);
  const cushion = Math.max((rawMax-rawMin)*0.25, 0.3);
  const min = rawMin - cushion, max = rawMax + cushion;
  const span = Math.max(max-min, 0.4);
  const stepX = weighted.length > 1 ? (W-padL-padR)/(weighted.length-1) : 0;

  const yFor = v => padT + (H-padT-padB) * (1 - ((v-min)/span));

  const pts = weighted.map((x,i) => [padL + i*stepX, yFor(+x.weight)]);
  const pathD = pts.map((p,i) => (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots = pts.map(p => `<circle cx='${p[0].toFixed(1)}' cy='${p[1].toFixed(1)}' r='4' style='fill:var(--accent)'/>`).join('');

  const ticks = [rawMax, (rawMax+rawMin)/2, rawMin];
  const grid = ticks.map(v => {
    const y = yFor(v);
    return `<line x1='${padL}' y1='${y.toFixed(1)}' x2='${W-padR}' y2='${y.toFixed(1)}' stroke='var(--line)' stroke-width='1' stroke-dasharray='2,3'/>
      <text x='${padL-6}' y='${(y+3).toFixed(1)}' font-size='9' fill='var(--sub)' text-anchor='end'>${v.toFixed(1)}</text>`;
  }).join('');

  const valueLabels = weighted.map((x,i) =>
    `<text x='${pts[i][0].toFixed(1)}' y='${(pts[i][1]-9).toFixed(1)}' font-size='9' font-weight='700' fill='var(--text)' text-anchor='middle'>${(+x.weight).toFixed(1)}</text>`
  ).join('');

  const dayLabels = weighted.map((x,i) => {
    const d = new Date(x.date+'T00:00:00');
    const wd = ['日','月','火','水','木','金','土'][d.getDay()];
    return `<text x='${pts[i][0].toFixed(1)}' y='${H-6}' font-size='9' fill='var(--sub)' text-anchor='middle'>${wd}</text>`;
  }).join('');

  wrap.innerHTML = `<svg viewBox='0 0 ${W} ${H}' style='width:100%;height:100%'>
    ${grid}
    <path d='${pathD}' fill='none' style='stroke:var(--accent)' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/>
    ${dots}
    ${valueLabels}
    ${dayLabels}
  </svg>`;
}

r_date.value = localDateStr();
loadEntryToForm();
refreshHome();
refreshRecord();
</script>
